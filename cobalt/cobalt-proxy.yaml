apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobalt-proxy
  namespace: cobalt
  labels:
    app: cobalt-proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cobalt-proxy
  template:
    metadata:
      labels:
        app: cobalt-proxy
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab.dev/node-class
                    operator: In
                    values:
                      - edge
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cobalt-proxy
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: homelab.dev/edge
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: haproxy
          image: haproxy:3.4-alpine@sha256:c0afc4864dca9c68694cd1290433f0ee79b5c55be80f6745a165ffe373b9a564
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
          ports:
            - containerPort: 9009
              name: proxy
          livenessProbe:
            tcpSocket:
              port: 9009
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9009
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              memory: "128Mi"
              cpu: "250m"
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: haproxy-config
          configMap:
            name: cobalt-haproxy
---
apiVersion: v1
kind: Service
metadata:
  name: cobalt-proxy
  namespace: cobalt
spec:
  selector:
    app: cobalt-proxy
  ports:
    - port: 9009
      targetPort: 9009
      nodePort: 30009
      name: proxy
  type: NodePort
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cobalt-proxy
  namespace: cobalt
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cobalt-proxy
