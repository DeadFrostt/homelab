apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-auth-proxy-config
  namespace: matrix
data:
  default.conf: |
    server {
      listen 8080;
      location ~ ^/_matrix/client/[^/]+/(login|logout|refresh) {
        proxy_http_version 1.1;
        proxy_pass http://mas.mas.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location / {
        proxy_http_version 1.1;
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-auth-proxy
  namespace: matrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matrix-auth-proxy
  template:
    metadata:
      labels:
        app: matrix-auth-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet: {path: /_matrix/client/versions, port: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: matrix-auth-proxy-config}
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-auth-proxy
  namespace: matrix
spec:
  type: NodePort
  selector:
    app: matrix-auth-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30899
