apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: gatus-inbox-zero
  namespace: gatus
spec:
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectId: fd17c52d-3b20-4958-9bc5-e061833835e9
        envSlug: prod
        secretsPath: /
        recursive: false
      credentialsRef:
        secretName: infisical-auth
        secretNamespace: infisical-operator
  managedSecretReference:
    secretName: gatus-inbox-zero
    secretNamespace: gatus
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        INBOX_ZERO_HEALTH_KEY: '{{ .HEALTH_API_KEY.Value }}'
