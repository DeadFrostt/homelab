apiVersion: v1
kind: ConfigMap
metadata:
  name: inbox-zero-maintenance
  namespace: inbox-zero
data:
  maintenance.mjs: "const base = process.env.INTERNAL_API_URL;\nconst endpoints =\
    \ process.argv.slice(2);\nif (!base || !process.env.CRON_SECRET || !endpoints.length)\
    \ process.exit(1);\n// Recreate rollouts briefly remove the only web endpoint.\
    \ Wait for readiness\n// rather than exhausting the Job's retries during routine\
    \ maintenance.\nlet ready = false;\nfor (let attempt = 0; attempt < 60; attempt++)\
    \ {\n  try {\n    const response = await fetch(base + '/api/health', {\n     \
    \ headers: { 'x-health-api-key': process.env.HEALTH_API_KEY },\n      signal:\
    \ AbortSignal.timeout(5000),\n    });\n    if (response.ok) { ready = true; break;\
    \ }\n  } catch {}\n  await new Promise(resolve => setTimeout(resolve, 5000));\n\
    }\nif (!ready) { console.error('Web readiness deadline exceeded'); process.exit(1);\
    \ }\nfor (const endpoint of endpoints) {\n  const response = await fetch(base\
    \ + endpoint, {\n    headers: { Authorization: `Bearer ${process.env.CRON_SECRET}`\
    \ },\n    signal: AbortSignal.timeout(180000),\n  });\n  // Never log response\
    \ bodies: some maintenance results contain mailbox data.\n  console.log(JSON.stringify({\
    \ endpoint, status: response.status }));\n  if (!response.ok) process.exit(1);\n\
    }\n"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inbox-zero-maintenance
  namespace: inbox-zero
spec:
  schedule: '*/15 * * * *'
  timeZone: America/Chicago
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: inbox-zero-maintenance
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: yeager
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: maintenance
            image: ghcr.io/deadfrostt/inbox-zero@sha256:50ad69a2292c22a7c81582bdd7e33ceae3a87512a739bbe6211f50733fb1cf72
            imagePullPolicy: Never
            command:
            - node
            - /maintenance/maintenance.mjs
            - /api/cron/automation-jobs
            - /api/cron/scheduled-actions
            envFrom:
            - configMapRef:
                name: inbox-zero-config
            - secretRef:
                name: inbox-zero-env
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: script
              mountPath: /maintenance
              readOnly: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
          volumes:
          - name: script
            configMap:
              name: inbox-zero-maintenance
---
