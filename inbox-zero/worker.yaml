apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox-zero-worker
  namespace: inbox-zero
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inbox-zero-worker
  template:
    metadata:
      labels:
        app: inbox-zero-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: yeager
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: ghcr.io/deadfrostt/inbox-zero@sha256:50ad69a2292c22a7c81582bdd7e33ceae3a87512a739bbe6211f50733fb1cf72
        imagePullPolicy: Never
        envFrom: &id001
        - configMapRef:
            name: inbox-zero-config
        - secretRef:
            name: inbox-zero-env
        securityContext: &id002
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        command:
        - /app/docker/scripts/start-worker.sh
      initContainers:
      - name: wait-for-web
        image: ghcr.io/deadfrostt/inbox-zero@sha256:50ad69a2292c22a7c81582bdd7e33ceae3a87512a739bbe6211f50733fb1cf72
        imagePullPolicy: Never
        command:
        - node
        - -e
        - const u=process.env.INTERNAL_API_URL+'/api/health';async function wait(){for(let
          n=0;n<180;n++){try{const r=await fetch(u,{headers:{'x-health-api-key':process.env.HEALTH_API_KEY}});if(r.ok)process.exit(0)}catch{}await
          new Promise(r=>setTimeout(r,5000))}process.exit(1)}wait()
        envFrom: *id001
        securityContext: *id002
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
