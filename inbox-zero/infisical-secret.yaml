apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: inbox-zero-secrets
  namespace: inbox-zero
spec:
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectId: fd17c52d-3b20-4958-9bc5-e061833835e9
        envSlug: prod
        secretsPath: /
        recursive: false
      credentialsRef:
        secretName: infisical-auth
        secretNamespace: infisical-operator
  managedKubeSecretReferences:
  - secretName: inbox-zero-env
    secretNamespace: inbox-zero
    secretType: Opaque
    creationPolicy: Owner
  - secretName: inbox-zero-pg-app
    secretNamespace: inbox-zero
    secretType: kubernetes.io/basic-auth
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        username: inboxzero
        password: '{{ .POSTGRES_PASSWORD.Value }}'
