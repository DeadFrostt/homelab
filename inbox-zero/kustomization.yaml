apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inbox-zero
resources:
- namespace.yaml
- networkpolicy.yaml
- limitrange.yaml
- infisical-secret.yaml
- cnpg-backup-secret.yaml
- cnpg-cluster.yaml
- cnpg-scheduledbackup.yaml
- configmap.yaml
- redis.yaml
- deployment.yaml
- worker.yaml
- cronjobs.yaml
configMapGenerator:
- name: inbox-zero-gmail-runtime
  files:
  - gmail-pacing.cjs=image/gmail-pacing.cjs
