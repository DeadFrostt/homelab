apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: matrix-coturn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: yeager
      initContainers:
        - name: render-config
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - sh
            - -c
            - |
              set -eu

              escape_sed_replacement() {
                printf '%s' "$1" | sed 's/[\\&|]/\\&/g'
              }

              turn_realm=$(escape_sed_replacement "$TURN_REALM")
              turn_server_name=$(escape_sed_replacement "$TURN_SERVER_NAME")
              coturn_auth_secret=$(escape_sed_replacement "$COTURN_AUTH_SECRET")
              turn_external_ip=$(escape_sed_replacement "$TURN_EXTERNAL_IP")
              turn_relay_ip=$(escape_sed_replacement "$TURN_RELAY_IP")

              sed \
                -e "s|\${TURN_REALM}|${turn_realm}|g" \
                -e "s|\${TURN_SERVER_NAME}|${turn_server_name}|g" \
                -e "s|\${COTURN_AUTH_SECRET}|${coturn_auth_secret}|g" \
                -e "s|\${TURN_EXTERNAL_IP}|${turn_external_ip}|g" \
                -e "s|\${TURN_RELAY_IP}|${turn_relay_ip}|g" \
                /tmp/tmpl/turnserver.conf.tmpl > /etc/coturn/turnserver.conf
          env:
            - name: COTURN_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-coturn-env
                  key: COTURN_AUTH_SECRET
            - name: TURN_REALM
              valueFrom:
                secretKeyRef:
                  name: matrix-coturn-env
                  key: TURN_REALM
            - name: TURN_SERVER_NAME
              valueFrom:
                secretKeyRef:
                  name: matrix-coturn-env
                  key: TURN_SERVER_NAME
            - name: TURN_EXTERNAL_IP
              valueFrom:
                secretKeyRef:
                  name: matrix-coturn-env
                  key: TURN_EXTERNAL_IP
            - name: TURN_RELAY_IP
              valueFrom:
                secretKeyRef:
                  name: matrix-coturn-env
                  key: TURN_RELAY_IP
          volumeMounts:
            - name: config-tmpl
              mountPath: /tmp/tmpl
              readOnly: true
            - name: config-rendered
              mountPath: /etc/coturn
      containers:
        - name: coturn
          image: coturn/coturn:latest@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
          args: ["turnserver", "-c", "/etc/coturn/turnserver.conf"]
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/coturn
              readOnly: true
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "25m"
      volumes:
        - name: config-tmpl
          configMap:
            name: coturn-config
        - name: config-rendered
          emptyDir: {}
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: Directory
