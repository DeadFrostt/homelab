apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-database-backup
  namespace: vaultwarden
spec:
  schedule: "0 2 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: vaultwarden-database-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: vaultwarden/server:latest@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  /vaultwarden backup
                  find /data -maxdepth 1 -type f -name 'db_*.sqlite3' -mtime +14 -delete
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vaultwarden-data
