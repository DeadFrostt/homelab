apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-postgres
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rakazo
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakazo
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      # Host resolver, not cluster DNS: these pods reach each other on 127.0.0.1 and
      # need only public names, and CoreDNS on this node intermittently times out.
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: ackermann
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
          imagePullPolicy: IfNotPresent
          workingDir: /var/lib/postgresql
          command:
            - postgres
            - -p
            - '5432'
            - -c
            - listen_addresses=127.0.0.1
          envFrom:
            - secretRef:
                name: rakazo-postgres-env
            - configMapRef:
                name: rakazo-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1024Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: pgdata
          hostPath:
            path: /var/lib/docker/volumes/rakazo-trial_pgdata/_data
            type: Directory
