apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-supervisor
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: supervisor
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rakazo
      app.kubernetes.io/component: supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakazo
        app.kubernetes.io/component: supervisor
    spec:
      # The tailscale sidecar needs an API token to persist its node key in a
      # Secret; the supervisor itself does not, and keeps it unmounted.
      serviceAccountName: tailscale
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ackermann
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 107
      initContainers:
        - name: prepare-computer-image
          image: ghcr.io/elie222/rakazo/app@sha256:971d2174b857f33695c6aef8f2ff836dcaf49ad8118fe290c55072cf59221591
          imagePullPolicy: IfNotPresent
          workingDir: /app/infra/sandboxes/supervisor
          command:
            - node
            - -e
            - |
              const Docker = require('dockerode');
              const docker = new Docker({ socketPath: '/var/run/docker.sock' });
              const image = process.env.RAKAZO_COMPUTER_IMAGE;
              async function prepare() {
                if (!/@sha256:[a-f0-9]{64}$/.test(image ?? '')) {
                  throw new Error('RAKAZO_COMPUTER_IMAGE must be pinned by digest');
                }
                try {
                  await docker.getImage(image).inspect();
                  console.log('Pinned computer image is already available');
                  return;
                } catch (error) {
                  if (error.statusCode !== 404) throw error;
                }
                console.log('Pulling pinned computer image:', image);
                const stream = await docker.pull(image);
                await new Promise((resolve, reject) => {
                  docker.modem.followProgress(stream, error => error ? reject(error) : resolve());
                });
                await docker.getImage(image).inspect();
                console.log('Pinned computer image is ready');
              }
              prepare().catch(error => {
                console.error(error.message);
                process.exitCode = 1;
              });
          envFrom:
            - configMapRef:
                name: rakazo-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: docker
              mountPath: /var/run/docker.sock
      containers:
        - name: supervisor
          image: ghcr.io/elie222/rakazo/app@sha256:971d2174b857f33695c6aef8f2ff836dcaf49ad8118fe290c55072cf59221591
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - pnpm
            - --filter
            - '@rakazo/sandbox-supervisor'
            - start
          envFrom:
            - secretRef:
                name: rakazo-supervisor-env
            - configMapRef:
                name: rakazo-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1024Mi
          volumeMounts:
            - name: appdata
              mountPath: /data
            - name: docker
              mountPath: /var/run/docker.sock
            - name: runtime
              mountPath: /app/infra/sandboxes/supervisor/src/index.ts
              subPath: index.ts
              readOnly: true
            - name: runtime
              mountPath: /app/infra/sandboxes/supervisor/src/computer-spec.ts
              subPath: computer-spec.ts
              readOnly: true
            - name: runtime
              mountPath: /app/infra/sandboxes/supervisor/src/native-runtime.ts
              subPath: native-runtime.ts
              readOnly: true
            - name: runtime
              mountPath: /app/infra/sandboxes/supervisor/src/egress-probe.ts
              subPath: egress-probe.ts
              readOnly: true
          startupProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:7091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:7091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:7091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
        # Userspace Tailscale. The supervisor shares this pod's network
        # namespace, so 127.0.0.1:1055 is a SOCKS5 proxy into the tailnet.
        # The filtered gateway exposes it to Rakazo computer bridges. Running in
        # userspace mode is deliberate: no tailscale0 interface is created on
        # Ackermann, so the node's own Tailscale transport stays off the Cilium
        # overlay it carries (see host-backup/tailscale-overlay-guard.sh).
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-tailscale-auth
                  key: TS_AUTHKEY
                  optional: true
          envFrom:
            - configMapRef:
                name: rakazo-tailscale-config
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
          startupProbe:
            httpGet:
              path: /healthz
              port: 9002
              host: 127.0.0.1
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9002
              host: 127.0.0.1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9002
              host: 127.0.0.1
            periodSeconds: 30
            failureThreshold: 5
        - name: tailnet-gateway
          image: ghcr.io/elie222/rakazo/app@sha256:971d2174b857f33695c6aef8f2ff836dcaf49ad8118fe290c55072cf59221591
          command: ["node", "/gateway/proxy.cjs"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tailnet-gateway
              mountPath: /gateway
              readOnly: true
          readinessProbe:
            tcpSocket:
              host: 172.17.0.1
              port: 1056
            periodSeconds: 5
      volumes:
        - name: tailnet-gateway
          configMap:
            name: rakazo-tailnet-gateway
        - name: appdata
          hostPath:
            path: /var/lib/docker/volumes/rakazo-trial_appdata/_data
            type: Directory
        - name: docker
          hostPath:
            path: /run/docker.sock
            type: Socket
        - name: runtime
          configMap:
            name: rakazo-native-runtime
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: rakazo-tailscale-state
