apiVersion: batch/v1
kind: Job
metadata:
  name: rakazo-migrate
  namespace: rakazo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: true
      # Host resolver, not cluster DNS: these pods reach each other on 127.0.0.1 and
      # need only public names, and CoreDNS on this node intermittently times out.
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: ackermann
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ghcr.io/elie222/rakazo/app@sha256:21e195e9dbee671b517a046a42ecc87628e5bd02534fdeae0b0b9290d80d01a0
        workingDir: /app
        command:
        - pnpm
        - db:migrate
        envFrom:
        - secretRef:
            name: rakazo-api-env
        - configMapRef:
            name: rakazo-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
