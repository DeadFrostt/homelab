apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rakazo-tailscale-state
  namespace: rakazo
  annotations:
    # local-path waits for a consumer: share the supervisor wave so Argo can
    # create that consumer before waiting for this claim to become Bound.
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
