apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rakazo-tailscale-state
  namespace: rakazo
  annotations:
    # Created before the supervisor starts so tailscaled never begins with a
    # fresh node identity and re-registers under a new name.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
