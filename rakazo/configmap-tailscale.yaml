apiVersion: v1
kind: ConfigMap
metadata:
  name: rakazo-tailscale-config
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  # Userspace networking only. tailscaled must never create a tailscale0
  # interface on Ackermann: the Cilium overlay is carried over Tailscale, and a
  # second interface advertising the node's addresses reintroduces the
  # recursion that host-backup/tailscale-overlay-guard.sh exists to prevent.
  TS_USERSPACE: "true"
  # The filtered gateway bridges Docker clients to this loopback listener.
  TS_SOCKS5_SERVER: "127.0.0.1:1055"
  TS_STATE_DIR: "/var/lib/tailscale"
  TS_AUTH_ONCE: "true"
  TS_ENABLE_HEALTH_CHECK: "true"
  TS_DEBUG_FIREWALL_MODE: "nftables"
  # Tag comes from the auth key (tag:rakazo-bot). It is not passed here.
  TS_EXTRA_ARGS: "--hostname=rakazo-supervisor-ackermann --accept-routes=false --accept-dns=false"
