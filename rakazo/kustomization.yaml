{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "rakazo",
  "resources": [
    "namespace.json",
    "configmap.json",
    "deployment-postgres.json",
    "deployment-supervisor.json",
    "deployment-api.json",
    "deployment-worker.json",
    "deployment-web.json"
  ],
  "configMapGenerator": [
    {
      "name": "rakazo-native-runtime",
      "files": [
        "runtime/index.ts",
        "runtime/computer-spec.ts",
        "runtime/native-runtime.ts",
        "runtime/egress-probe.ts"
      ]
    }
  ]
}
