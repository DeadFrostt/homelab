apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rakazo
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment-postgres.yaml
  - deployment-supervisor.yaml
  - deployment-api.yaml
  - deployment-worker.yaml
  - deployment-web.yaml
configMapGenerator:
  - name: rakazo-native-runtime
    files:
      - runtime/index.ts
      - runtime/computer-spec.ts
      - runtime/native-runtime.ts
      - runtime/egress-probe.ts
