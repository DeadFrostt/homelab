apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rakazo
resources:
  - namespace.yaml
  - configmap.yaml
  - configmap-tailscale.yaml
  - rbac-tailscale.yaml
  - pvc-tailscale.yaml
  - networkpolicy-tailscale.yaml
  - deployment-postgres.yaml
  - migration-job.yaml
  - deployment-supervisor.yaml
  - deployment-api.yaml
  - deployment-worker.yaml
  - deployment-web.yaml
configMapGenerator:
  - name: rakazo-native-runtime
    files:
      - runtime/index.ts
      - runtime/computer-spec.ts
      - runtime/native-runtime.ts
      - runtime/egress-probe.ts
  - name: rakazo-tailnet-gateway
    files:
      - proxy.cjs=proxy/proxy.cjs
