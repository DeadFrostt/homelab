apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-api
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rakazo
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakazo
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ackermann
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/elie222/rakazo/app@sha256:a7fd1081fcc3dcfbe37adfc6af505bd5b73980abbca58ed2e25d588b3dd8333f
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/api
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          envFrom:
            - secretRef:
                name: rakazo-api-env
            - configMapRef:
                name: rakazo-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 1536Mi
          volumeMounts:
            - name: appdata
              mountPath: /data
          startupProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: appdata
          hostPath:
            path: /var/lib/docker/volumes/rakazo-trial_appdata/_data
            type: Directory
