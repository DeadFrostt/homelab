apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-web
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rakazo
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakazo
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ackermann
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/elie222/rakazo/app@sha256:cd026fef7603396eb6d9b4b85e182a052513e492ea6db1067df43118016dea7a
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/web
          command:
            - node_modules/.bin/vite
            - preview
            - --host
            - 172.27.0.1
            - --port
            - '5173'
          envFrom:
            - secretRef:
                name: rakazo-web-env
            - configMapRef:
                name: rakazo-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1024Mi
          volumeMounts:
            - name: webassets
              mountPath: /app/apps/web/asset-archive
          startupProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://172.27.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://172.27.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://172.27.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: webassets
          hostPath:
            path: /var/lib/docker/volumes/rakazo-trial_webassets/_data
            type: Directory
